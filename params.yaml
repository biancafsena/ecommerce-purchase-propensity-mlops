data:
  target_column: Revenue
  random_seed: 42
  train_size: 0.70
  validation_size: 0.15
  test_size: 0.15

modeling:
  random_seed: 42
  primary_metric: average_precision

  baseline:
    model_type: logistic_regression
    class_weight: null
    solver: lbfgs
    max_iter: 2000

  candidates:
    random_forest:
      n_estimators: 300
      max_depth: 12
      min_samples_leaf: 5
      class_weight: null
      n_jobs: -1


evaluation:
  decision_threshold: 0.50
  threshold_strategy: maximize_f1
