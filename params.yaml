data:
  target_column: Revenue
  random_seed: 42
  train_size: 0.70
  validation_size: 0.15
  test_size: 0.15

modeling:
  random_seed: 42
  primary_metric: average_precision

  baseline:
    model_type: logistic_regression
    class_weight: balanced
    solver: lbfgs
    max_iter: 1000

  candidates:
    random_forest:
      n_estimators: 300
      max_depth: null
      min_samples_leaf: 2
      class_weight: balanced
      n_jobs: -1

    extra_trees:
      n_estimators: 300
      max_depth: null
      min_samples_leaf: 2
      class_weight: balanced
      n_jobs: -1

evaluation:
  decision_threshold: 0.50
  threshold_strategy: maximize_f1
