stages:
  validate_data:
    cmd: poetry run python -m purchase_propensity.data.validate
    deps:
    - data/raw/online_shoppers_intention.csv
    - src/purchase_propensity/data/download.py
    - src/purchase_propensity/data/schema.py
    - src/purchase_propensity/data/validate.py
    metrics:
    - reports/metrics/raw_data_validation.json:
        cache: false
  preprocess:
    cmd: poetry run python -m purchase_propensity.data.preprocess
    deps:
    - data/raw/online_shoppers_intention.csv
    - reports/metrics/raw_data_validation.json
    - src/purchase_propensity/data/preprocess.py
    - src/purchase_propensity/data/schema.py
    params:
    - data.random_seed
    - data.target_column
    - data.test_size
    - data.train_size
    - data.validation_size
    outs:
    - data/processed
  train_baseline:
    cmd: poetry run python -m purchase_propensity.modeling.train
    deps:
    - data/processed/train.parquet
    - data/processed/validation.parquet
    - src/purchase_propensity/features/build.py
    - src/purchase_propensity/modeling/build.py
    - src/purchase_propensity/modeling/metrics.py
    - src/purchase_propensity/modeling/train.py
    params:
    - data.target_column
    - evaluation.decision_threshold
    - modeling.baseline.class_weight
    - modeling.baseline.max_iter
    - modeling.baseline.model_type
    - modeling.baseline.solver
    - modeling.primary_metric
    - modeling.random_seed
    outs:
    - models/baseline_logistic_regression.joblib
    metrics:
    - reports/metrics/baseline_validation_metrics.json:
        cache: false
  evaluate_baseline:
    cmd: poetry run python -m purchase_propensity.modeling.evaluate
    deps:
    - data/processed/test.parquet
    - data/processed/validation.parquet
    - models/baseline_logistic_regression.joblib
    - src/purchase_propensity/features/build.py
    - src/purchase_propensity/modeling/evaluate.py
    - src/purchase_propensity/modeling/metrics.py
    params:
    - data.target_column
    - evaluation.decision_threshold
    - evaluation.threshold_strategy
    metrics:
    - reports/metrics/baseline_test_metrics.json:
        cache: false
    plots:
    - reports/figures/baseline:
        cache: false
