stages:
  validate_data:
    cmd: poetry run python -m purchase_propensity.data.validate
    deps:
    - data/raw/online_shoppers_intention.csv
    - src/purchase_propensity/data/download.py
    - src/purchase_propensity/data/schema.py
    - src/purchase_propensity/data/validate.py
    metrics:
    - reports/metrics/raw_data_validation.json:
        cache: false
  preprocess:
    cmd: poetry run python -m purchase_propensity.data.preprocess
    deps:
    - data/raw/online_shoppers_intention.csv
    - reports/metrics/raw_data_validation.json
    - src/purchase_propensity/data/preprocess.py
    - src/purchase_propensity/data/schema.py
    params:
    - data.random_seed
    - data.target_column
    - data.test_size
    - data.train_size
    - data.validation_size
    outs:
    - data/processed
  train_baseline:
    cmd: poetry run python -m purchase_propensity.modeling.train
    deps:
    - data/processed/train.parquet
    - data/processed/validation.parquet
    - src/purchase_propensity/features/build.py
    - src/purchase_propensity/modeling/build.py
    - src/purchase_propensity/modeling/metrics.py
    - src/purchase_propensity/modeling/train.py
    params:
    - data.target_column
    - evaluation.decision_threshold
    - modeling.baseline.class_weight
    - modeling.baseline.max_iter
    - modeling.baseline.model_type
    - modeling.baseline.solver
    - modeling.primary_metric
    - modeling.random_seed
    outs:
    - models/baseline_logistic_regression.joblib
    metrics:
    - reports/metrics/baseline_validation_metrics.json:
        cache: false
  evaluate_baseline:
    cmd: poetry run python -m purchase_propensity.modeling.evaluate
    deps:
    - data/processed/test.parquet
    - data/processed/validation.parquet
    - models/baseline_logistic_regression.joblib
    - src/purchase_propensity/features/build.py
    - src/purchase_propensity/modeling/evaluate.py
    - src/purchase_propensity/modeling/metrics.py
    params:
    - data.target_column
    - evaluation.decision_threshold
    - evaluation.threshold_strategy
    metrics:
    - reports/metrics/baseline_test_metrics.json:
        cache: false
    plots:
    - reports/figures/baseline:
        cache: false
  compare_models:
    cmd: poetry run python -m purchase_propensity.modeling.compare
    deps:
    - data/processed/train.parquet
    - data/processed/validation.parquet
    - src/purchase_propensity/features/build.py
    - src/purchase_propensity/modeling/build.py
    - src/purchase_propensity/modeling/compare.py
    - src/purchase_propensity/modeling/metrics.py
    - src/purchase_propensity/modeling/train.py
    params:
    - data.target_column
    - evaluation.decision_threshold
    - modeling.baseline.class_weight
    - modeling.baseline.max_iter
    - modeling.baseline.model_type
    - modeling.baseline.solver
    - modeling.candidates.extra_trees.class_weight
    - modeling.candidates.extra_trees.max_depth
    - modeling.candidates.extra_trees.min_samples_leaf
    - modeling.candidates.extra_trees.n_estimators
    - modeling.candidates.extra_trees.n_jobs
    - modeling.candidates.random_forest.class_weight
    - modeling.candidates.random_forest.max_depth
    - modeling.candidates.random_forest.min_samples_leaf
    - modeling.candidates.random_forest.n_estimators
    - modeling.candidates.random_forest.n_jobs
    - modeling.primary_metric
    - modeling.random_seed
    outs:
    - models/selected_model.joblib
    metrics:
    - reports/metrics/model_comparison.json:
        cache: false
  evaluate_selected_model:
    cmd: poetry run python -m purchase_propensity.modeling.evaluate
      --model-name random_forest   --model models/selected_model.joblib
      --report reports/metrics/selected_model_test_metrics.json
      --figures-directory reports/figures/selected_model
    deps:
    - data/processed/test.parquet
    - data/processed/validation.parquet
    - models/selected_model.joblib
    - src/purchase_propensity/features/build.py
    - src/purchase_propensity/modeling/evaluate.py
    - src/purchase_propensity/modeling/metrics.py
    params:
    - data.target_column
    - evaluation.decision_threshold
    - evaluation.threshold_strategy
    metrics:
    - reports/metrics/selected_model_test_metrics.json:
        cache: false
    plots:
    - reports/figures/selected_model:
        cache: false
